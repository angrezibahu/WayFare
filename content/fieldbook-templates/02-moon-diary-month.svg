<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm">
  <style>
    text { font-family: Georgia, 'Times New Roman', serif; fill: #1a1a1a; }
    .title { font-size: 14px; letter-spacing: 0.5px; }
    .sub { font-size: 7px; font-style: italic; fill: #555; }
    .label { font-size: 4px; letter-spacing: 0.3px; fill: #555; }
    .line { stroke: #1a1a1a; fill: none; }
    .thin { stroke-width: 0.3; }
    .frame { stroke-width: 0.5; }
  </style>
  <rect x="10" y="10" width="190" height="277" class="line frame"/>

  <text x="20" y="25" class="title">Moon Diary — one month</text>
  <text x="20" y="33" class="sub">One small circle per night. Same time each night if you can. Cross out cloudy nights.</text>

  <text x="20" y="45" class="label">MONTH</text>
  <line x1="35" y1="46" x2="95" y2="46" class="line thin"/>
  <text x="110" y="45" class="label">YEAR</text>
  <line x1="122" y1="46" x2="160" y2="46" class="line thin"/>

  <!-- 6 rows x 5 cols = 30 days. Cell size 32 x 40, start at x=20 y=55 -->
  <g>
    <!-- Row 1 -->
    <g>
      <circle cx="36" cy="72" r="10" class="line thin"/><text x="36" y="92" text-anchor="middle" class="label">DAY 1</text>
      <circle cx="68" cy="72" r="10" class="line thin"/><text x="68" y="92" text-anchor="middle" class="label">DAY 2</text>
      <circle cx="100" cy="72" r="10" class="line thin"/><text x="100" y="92" text-anchor="middle" class="label">DAY 3</text>
      <circle cx="132" cy="72" r="10" class="line thin"/><text x="132" y="92" text-anchor="middle" class="label">DAY 4</text>
      <circle cx="164" cy="72" r="10" class="line thin"/><text x="164" y="92" text-anchor="middle" class="label">DAY 5</text>
    </g>
    <g>
      <circle cx="36" cy="112" r="10" class="line thin"/><text x="36" y="132" text-anchor="middle" class="label">DAY 6</text>
      <circle cx="68" cy="112" r="10" class="line thin"/><text x="68" y="132" text-anchor="middle" class="label">DAY 7</text>
      <circle cx="100" cy="112" r="10" class="line thin"/><text x="100" y="132" text-anchor="middle" class="label">DAY 8</text>
      <circle cx="132" cy="112" r="10" class="line thin"/><text x="132" y="132" text-anchor="middle" class="label">DAY 9</text>
      <circle cx="164" cy="112" r="10" class="line thin"/><text x="164" y="132" text-anchor="middle" class="label">DAY 10</text>
    </g>
    <g>
      <circle cx="36" cy="152" r="10" class="line thin"/><text x="36" y="172" text-anchor="middle" class="label">DAY 11</text>
      <circle cx="68" cy="152" r="10" class="line thin"/><text x="68" y="172" text-anchor="middle" class="label">DAY 12</text>
      <circle cx="100" cy="152" r="10" class="line thin"/><text x="100" y="172" text-anchor="middle" class="label">DAY 13</text>
      <circle cx="132" cy="152" r="10" class="line thin"/><text x="132" y="172" text-anchor="middle" class="label">DAY 14</text>
      <circle cx="164" cy="152" r="10" class="line thin"/><text x="164" y="172" text-anchor="middle" class="label">DAY 15</text>
    </g>
    <g>
      <circle cx="36" cy="192" r="10" class="line thin"/><text x="36" y="212" text-anchor="middle" class="label">DAY 16</text>
      <circle cx="68" cy="192" r="10" class="line thin"/><text x="68" y="212" text-anchor="middle" class="label">DAY 17</text>
      <circle cx="100" cy="192" r="10" class="line thin"/><text x="100" y="212" text-anchor="middle" class="label">DAY 18</text>
      <circle cx="132" cy="192" r="10" class="line thin"/><text x="132" y="212" text-anchor="middle" class="label">DAY 19</text>
      <circle cx="164" cy="192" r="10" class="line thin"/><text x="164" y="212" text-anchor="middle" class="label">DAY 20</text>
    </g>
    <g>
      <circle cx="36" cy="232" r="10" class="line thin"/><text x="36" y="252" text-anchor="middle" class="label">DAY 21</text>
      <circle cx="68" cy="232" r="10" class="line thin"/><text x="68" y="252" text-anchor="middle" class="label">DAY 22</text>
      <circle cx="100" cy="232" r="10" class="line thin"/><text x="100" y="252" text-anchor="middle" class="label">DAY 23</text>
      <circle cx="132" cy="232" r="10" class="line thin"/><text x="132" y="252" text-anchor="middle" class="label">DAY 24</text>
      <circle cx="164" cy="232" r="10" class="line thin"/><text x="164" y="252" text-anchor="middle" class="label">DAY 25</text>
    </g>
    <g>
      <circle cx="36" cy="268" r="8" class="line thin"/><text x="36" y="283" text-anchor="middle" class="label">DAY 26</text>
      <circle cx="68" cy="268" r="8" class="line thin"/><text x="68" y="283" text-anchor="middle" class="label">DAY 27</text>
      <circle cx="100" cy="268" r="8" class="line thin"/><text x="100" y="283" text-anchor="middle" class="label">DAY 28</text>
      <circle cx="132" cy="268" r="8" class="line thin"/><text x="132" y="283" text-anchor="middle" class="label">DAY 29</text>
      <circle cx="164" cy="268" r="8" class="line thin"/><text x="164" y="283" text-anchor="middle" class="label">DAY 30</text>
    </g>
  </g>

  <text x="105" y="292" text-anchor="middle" class="label">wayfare · moon diary month · v1</text>
</svg>
