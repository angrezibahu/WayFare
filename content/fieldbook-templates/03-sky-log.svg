<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm">
  <style>
    text { font-family: Georgia, 'Times New Roman', serif; fill: #1a1a1a; }
    .title { font-size: 14px; letter-spacing: 0.5px; }
    .sub { font-size: 7px; font-style: italic; fill: #555; }
    .label { font-size: 4.5px; letter-spacing: 0.3px; fill: #555; }
    .line { stroke: #1a1a1a; fill: none; }
    .thin { stroke-width: 0.3; }
    .frame { stroke-width: 0.5; }
  </style>
  <rect x="10" y="10" width="190" height="277" class="line frame"/>

  <text x="20" y="25" class="title">Sky Log</text>
  <text x="20" y="33" class="sub">One page per sighting. Write like you're telling it to yourself in five years.</text>

  <!-- Top row of fields -->
  <text x="20" y="48" class="label">DATE</text>
  <line x1="33" y1="49" x2="80" y2="49" class="line thin"/>
  <text x="90" y="48" class="label">TIME</text>
  <line x1="101" y1="49" x2="140" y2="49" class="line thin"/>
  <text x="150" y="48" class="label">WEATHER</text>
  <line x1="169" y1="49" x2="195" y2="49" class="line thin"/>

  <text x="20" y="60" class="label">LOCATION</text>
  <line x1="38" y1="61" x2="195" y2="61" class="line thin"/>

  <text x="20" y="72" class="label">WHO WAS THERE</text>
  <line x1="52" y1="73" x2="195" y2="73" class="line thin"/>

  <text x="20" y="84" class="label">WHAT I CAME TO SEE</text>
  <line x1="63" y1="85" x2="195" y2="85" class="line thin"/>

  <!-- Sketch box -->
  <text x="20" y="96" class="label">SKETCH</text>
  <rect x="20" y="99" width="170" height="110" class="line thin"/>

  <!-- Notes -->
  <text x="20" y="219" class="label">NOTES</text>
  <g class="line thin">
    <line x1="20" y1="227" x2="190" y2="227"/>
    <line x1="20" y1="237" x2="190" y2="237"/>
    <line x1="20" y1="247" x2="190" y2="247"/>
    <line x1="20" y1="257" x2="190" y2="257"/>
    <line x1="20" y1="267" x2="190" y2="267"/>
    <line x1="20" y1="277" x2="190" y2="277"/>
  </g>

  <text x="105" y="289" text-anchor="middle" class="label">wayfare · sky log · v1</text>
</svg>
