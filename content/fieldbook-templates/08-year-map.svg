<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm">
  <style>
    text { font-family: Georgia, 'Times New Roman', serif; fill: #1a1a1a; }
    .title { font-size: 14px; letter-spacing: 0.5px; }
    .sub { font-size: 7px; font-style: italic; fill: #555; }
    .label { font-size: 4.5px; letter-spacing: 0.3px; fill: #555; }
    .cell { font-size: 3.5px; fill: #555; }
    .month { font-size: 6px; letter-spacing: 0.3px; }
    .line { stroke: #1a1a1a; fill: none; }
    .thin { stroke-width: 0.3; }
    .frame { stroke-width: 0.5; }
  </style>
  <rect x="10" y="10" width="190" height="277" class="line frame"/>

  <text x="20" y="25" class="title">Year Map</text>
  <text x="20" y="33" class="sub">Mark every night you saw the sky. Every challenge completed. Every capstone.</text>

  <text x="20" y="45" class="label">YEAR</text>
  <line x1="30" y1="46" x2="70" y2="46" class="line thin"/>

  <!-- 12 month rows, 31 day columns -->
  <g>
    <!-- header numbers 1..31 -->
    <g class="cell">
      <text x="42" y="56">1</text><text x="47" y="56">2</text><text x="52" y="56">3</text><text x="57" y="56">4</text><text x="62" y="56">5</text>
      <text x="67" y="56">6</text><text x="72" y="56">7</text><text x="77" y="56">8</text><text x="82" y="56">9</text><text x="87" y="56">10</text>
      <text x="92" y="56">11</text><text x="97" y="56">12</text><text x="102" y="56">13</text><text x="107" y="56">14</text><text x="112" y="56">15</text>
      <text x="117" y="56">16</text><text x="122" y="56">17</text><text x="127" y="56">18</text><text x="132" y="56">19</text><text x="137" y="56">20</text>
      <text x="142" y="56">21</text><text x="147" y="56">22</text><text x="152" y="56">23</text><text x="157" y="56">24</text><text x="162" y="56">25</text>
      <text x="167" y="56">26</text><text x="172" y="56">27</text><text x="177" y="56">28</text><text x="182" y="56">29</text><text x="187" y="56">30</text>
      <text x="192" y="56">31</text>
    </g>
  </g>

  <!-- 12 rows of 31 cells. Cell size 5x12. Start y=60. -->
  <g>
    <!-- rows -->
    <g class="line thin">
      <rect x="40" y="60" width="155" height="12"/>
      <rect x="40" y="72" width="155" height="12"/>
      <rect x="40" y="84" width="155" height="12"/>
      <rect x="40" y="96" width="155" height="12"/>
      <rect x="40" y="108" width="155" height="12"/>
      <rect x="40" y="120" width="155" height="12"/>
      <rect x="40" y="132" width="155" height="12"/>
      <rect x="40" y="144" width="155" height="12"/>
      <rect x="40" y="156" width="155" height="12"/>
      <rect x="40" y="168" width="155" height="12"/>
      <rect x="40" y="180" width="155" height="12"/>
      <rect x="40" y="192" width="155" height="12"/>
    </g>

    <!-- vertical gridlines every 5mm inside rows -->
    <g class="line thin">
      <line x1="45" y1="60" x2="45" y2="204"/>
      <line x1="50" y1="60" x2="50" y2="204"/>
      <line x1="55" y1="60" x2="55" y2="204"/>
      <line x1="60" y1="60" x2="60" y2="204"/>
      <line x1="65" y1="60" x2="65" y2="204"/>
      <line x1="70" y1="60" x2="70" y2="204"/>
      <line x1="75" y1="60" x2="75" y2="204"/>
      <line x1="80" y1="60" x2="80" y2="204"/>
      <line x1="85" y1="60" x2="85" y2="204"/>
      <line x1="90" y1="60" x2="90" y2="204"/>
      <line x1="95" y1="60" x2="95" y2="204"/>
      <line x1="100" y1="60" x2="100" y2="204"/>
      <line x1="105" y1="60" x2="105" y2="204"/>
      <line x1="110" y1="60" x2="110" y2="204"/>
      <line x1="115" y1="60" x2="115" y2="204"/>
      <line x1="120" y1="60" x2="120" y2="204"/>
      <line x1="125" y1="60" x2="125" y2="204"/>
      <line x1="130" y1="60" x2="130" y2="204"/>
      <line x1="135" y1="60" x2="135" y2="204"/>
      <line x1="140" y1="60" x2="140" y2="204"/>
      <line x1="145" y1="60" x2="145" y2="204"/>
      <line x1="150" y1="60" x2="150" y2="204"/>
      <line x1="155" y1="60" x2="155" y2="204"/>
      <line x1="160" y1="60" x2="160" y2="204"/>
      <line x1="165" y1="60" x2="165" y2="204"/>
      <line x1="170" y1="60" x2="170" y2="204"/>
      <line x1="175" y1="60" x2="175" y2="204"/>
      <line x1="180" y1="60" x2="180" y2="204"/>
      <line x1="185" y1="60" x2="185" y2="204"/>
      <line x1="190" y1="60" x2="190" y2="204"/>
    </g>

    <!-- month labels -->
    <g class="month">
      <text x="20" y="68">JAN</text>
      <text x="20" y="80">FEB</text>
      <text x="20" y="92">MAR</text>
      <text x="20" y="104">APR</text>
      <text x="20" y="116">MAY</text>
      <text x="20" y="128">JUN</text>
      <text x="20" y="140">JUL</text>
      <text x="20" y="152">AUG</text>
      <text x="20" y="164">SEP</text>
      <text x="20" y="176">OCT</text>
      <text x="20" y="188">NOV</text>
      <text x="20" y="200">DEC</text>
    </g>
  </g>

  <!-- Legend -->
  <text x="20" y="220" class="label">LEGEND  (mark cells yourself — suggestions)</text>
  <g class="cell">
    <rect x="20" y="225" width="5" height="5" class="line thin"/>
    <text x="29" y="229">clear night, sky seen</text>
    <rect x="80" y="225" width="5" height="5" class="line thin"/>
    <text x="89" y="229">challenge completed</text>
    <rect x="140" y="225" width="5" height="5" class="line thin"/>
    <text x="149" y="229">capstone</text>
  </g>

  <!-- Notes area -->
  <text x="20" y="245" class="label">NOTES FOR THE YEAR</text>
  <g class="line thin">
    <line x1="20" y1="253" x2="190" y2="253"/>
    <line x1="20" y1="263" x2="190" y2="263"/>
    <line x1="20" y1="273" x2="190" y2="273"/>
  </g>

  <text x="105" y="289" text-anchor="middle" class="label">wayfare · year map · v1</text>
</svg>
