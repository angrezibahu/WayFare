<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm">
  <style>
    text { font-family: Georgia, 'Times New Roman', serif; fill: #1a1a1a; }
    .title { font-size: 22px; letter-spacing: 1px; }
    .subtitle { font-size: 10px; font-style: italic; }
    .label { font-size: 5px; letter-spacing: 0.5px; fill: #555; }
    .line { stroke: #1a1a1a; fill: none; }
    .thin { stroke-width: 0.3; }
    .frame { stroke-width: 0.5; }
    .heavy { stroke-width: 0.9; }
  </style>
  <rect x="10" y="10" width="190" height="277" class="line frame" fill="none"/>
  <text x="105" y="70" text-anchor="middle" class="title">WayFare Fieldbook</text>
