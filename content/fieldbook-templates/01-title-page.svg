  <line x1="85" y1="160" x2="125" y2="160" class="line thin"/>

  <text x="105" y="185" text-anchor="middle" class="label">OUR CREST — DRAW HERE</text>
  <circle cx="105" cy="225" r="28" class="line frame" fill="none"/>

  <text x="105" y="275" text-anchor="middle" class="label">wayfare · title page · v1</text>
</svg>
