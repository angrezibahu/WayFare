<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm">
  <style>
    text { font-family: Georgia, 'Times New Roman', serif; fill: #1a1a1a; }
    .title { font-size: 14px; letter-spacing: 0.5px; }
    .sub { font-size: 7px; font-style: italic; fill: #555; }
    .label { font-size: 4.5px; letter-spacing: 0.3px; fill: #555; }
    .line { stroke: #1a1a1a; fill: none; }
    .thin { stroke-width: 0.3; }
    .frame { stroke-width: 0.5; }
  </style>
  <rect x="10" y="10" width="190" height="277" class="line frame"/>

  <text x="20" y="25" class="title">Error Journal</text>
  <text x="20" y="33" class="sub">Log a time you got turned around, lost, or misread something. No shame. This is the main event.</text>

  <text x="20" y="48" class="label">DATE</text>
  <line x1="33" y1="49" x2="80" y2="49" class="line thin"/>
  <text x="90" y="48" class="label">WHERE I WAS</text>
  <line x1="114" y1="49" x2="195" y2="49" class="line thin"/>

  <text x="20" y="62" class="label">WHAT HAPPENED</text>
  <g class="line thin">
    <line x1="20" y1="70" x2="190" y2="70"/>
    <line x1="20" y1="80" x2="190" y2="80"/>
    <line x1="20" y1="90" x2="190" y2="90"/>
    <line x1="20" y1="100" x2="190" y2="100"/>
    <line x1="20" y1="110" x2="190" y2="110"/>
    <line x1="20" y1="120" x2="190" y2="120"/>
  </g>

  <text x="20" y="132" class="label">WHAT I THOUGHT WAS TRUE</text>
  <g class="line thin">
    <line x1="20" y1="140" x2="190" y2="140"/>
    <line x1="20" y1="150" x2="190" y2="150"/>
    <line x1="20" y1="160" x2="190" y2="160"/>
  </g>

  <text x="20" y="172" class="label">WHAT WAS ACTUALLY TRUE</text>
  <g class="line thin">
    <line x1="20" y1="180" x2="190" y2="180"/>
    <line x1="20" y1="190" x2="190" y2="190"/>
    <line x1="20" y1="200" x2="190" y2="200"/>
  </g>

  <text x="20" y="212" class="label">WHAT I'LL DO DIFFERENTLY</text>
  <g class="line thin">
    <line x1="20" y1="220" x2="190" y2="220"/>
    <line x1="20" y1="230" x2="190" y2="230"/>
    <line x1="20" y1="240" x2="190" y2="240"/>
    <line x1="20" y1="250" x2="190" y2="250"/>
    <line x1="20" y1="260" x2="190" y2="260"/>
    <line x1="20" y1="270" x2="190" y2="270"/>
  </g>

  <text x="105" y="289" text-anchor="middle" class="label">wayfare · error journal · v1</text>
</svg>
