<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm">
  <style>
    text { font-family: Georgia, 'Times New Roman', serif; fill: #1a1a1a; }
    .title { font-size: 14px; letter-spacing: 0.5px; }
    .sub { font-size: 7px; font-style: italic; fill: #555; }
    .label { font-size: 4.5px; letter-spacing: 0.3px; fill: #555; }
    .line { stroke: #1a1a1a; fill: none; }
    .thin { stroke-width: 0.3; }
    .frame { stroke-width: 0.5; }
  </style>
  <rect x="10" y="10" width="190" height="277" class="line frame"/>

  <text x="20" y="25" class="title">Story of This Place</text>
  <text x="20" y="33" class="sub">Every meaningful local spot gets a page. This is our family's songline.</text>

  <text x="20" y="48" class="label">PLACE NAME</text>
  <line x1="42" y1="49" x2="195" y2="49" class="line thin"/>

  <text x="20" y="60" class="label">HOW TO GET THERE</text>
  <line x1="52" y1="61" x2="195" y2="61" class="line thin"/>

  <text x="20" y="72" class="label">WHERE THE NAME COMES FROM (AND WHOSE LANGUAGE)</text>
  <g class="line thin">
    <line x1="20" y1="80" x2="190" y2="80"/>
    <line x1="20" y1="90" x2="190" y2="90"/>
    <line x1="20" y1="100" x2="190" y2="100"/>
  </g>

  <text x="20" y="112" class="label">SKETCH / MAP</text>
  <rect x="20" y="115" width="170" height="90" class="line thin"/>

  <text x="20" y="215" class="label">WHAT IT MEANS TO US</text>
  <g class="line thin">
    <line x1="20" y1="223" x2="190" y2="223"/>
    <line x1="20" y1="233" x2="190" y2="233"/>
    <line x1="20" y1="243" x2="190" y2="243"/>
    <line x1="20" y1="253" x2="190" y2="253"/>
    <line x1="20" y1="263" x2="190" y2="263"/>
    <line x1="20" y1="273" x2="190" y2="273"/>
  </g>

  <text x="105" y="289" text-anchor="middle" class="label">wayfare · story of this place · v1</text>
</svg>
