<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm">
  <style>
    text { font-family: Georgia, 'Times New Roman', serif; fill: #1a1a1a; }
    .title  { font-size: 13px; letter-spacing: 0.5px; font-weight: bold; }
    .label  { font-size: 5px; letter-spacing: 0.4px; fill: #555; text-transform: uppercase; }
    .prompt { font-size: 6px; font-style: italic; fill: #777; }
    .line   { stroke: #1a1a1a; fill: none; stroke-width: 0.3; }
    .frame  { stroke: #1a1a1a; fill: none; stroke-width: 0.5; }
    .box    { stroke: #1a1a1a; fill: none; stroke-width: 0.3; }
  </style>

  <!-- outer border -->
  <rect x="10" y="10" width="190" height="277" class="frame"/>

  <!-- title -->
  <text x="20" y="24" class="title">Things I Found</text>
  <line x1="20" y1="27" x2="190" y2="27" class="line"/>

  <!-- date / observer line -->
  <text x="20" y="36" class="label">DATE</text>
  <line x1="33"  y1="37" x2="105" y2="37" class="line"/>
  <text x="110" y="36" class="label">PLACE / OUTING</text>
  <line x1="150" y1="37" x2="198" y2="37" class="line"/>

  <!-- ── PROMPT 1: The weather ──────────────────── -->
  <text x="20" y="48" class="label">THE WEATHER</text>
  <text x="20" y="55" class="prompt">(temperature feel, cloud, wind, smell of the air)</text>
  <line x1="20" y1="60" x2="198" y2="60" class="line"/>
  <line x1="20" y1="68" x2="198" y2="68" class="line"/>
  <line x1="20" y1="76" x2="198" y2="76" class="line"/>

  <!-- ── PROMPT 2: What I heard ─────────────────── -->
  <text x="20" y="87" class="label">WHAT I HEARD</text>
  <text x="20" y="94" class="prompt">(birds, water, wind, people, silence)</text>
  <line x1="20" y1="99" x2="198" y2="99" class="line"/>
  <line x1="20" y1="107" x2="198" y2="107" class="line"/>
  <line x1="20" y1="115" x2="198" y2="115" class="line"/>

  <!-- ── PROMPT 3: What I drew (sketch box) ────── -->
  <text x="20" y="126" class="label">WHAT I DREW</text>
  <text x="20" y="133" class="prompt">(a sketch, a map, a face, anything)</text>
  <!-- large sketch box -->
  <rect x="20" y="136" width="170" height="68" class="box"/>
  <!-- very faint cross-hatch guide lines inside box -->
  <line x1="105" y1="136" x2="105" y2="204" stroke="#e0e0e0" stroke-width="0.2" fill="none"/>
  <line x1="20"  y1="170" x2="190" y2="170" stroke="#e0e0e0" stroke-width="0.2" fill="none"/>

  <!-- ── PROMPT 4: The story I remembered ──────── -->
  <text x="20" y="216" class="label">THE STORY I REMEMBERED</text>
  <text x="20" y="223" class="prompt">(a tale about this place, season, or sky — who told it?)</text>
  <line x1="20" y1="228" x2="198" y2="228" class="line"/>
  <line x1="20" y1="236" x2="198" y2="236" class="line"/>
  <line x1="20" y1="244" x2="198" y2="244" class="line"/>

  <!-- ── PROMPT 5: One question ─────────────────── -->
  <text x="20" y="255" class="label">A QUESTION I STILL HAVE</text>
  <line x1="20" y1="263" x2="198" y2="263" class="line"/>
  <line x1="20" y1="271" x2="198" y2="271" class="line"/>
  <line x1="20" y1="279" x2="198" y2="279" class="line"/>

  <!-- footer -->
  <text x="105" y="291" text-anchor="middle" class="label">wayfare · things i found · v1</text>
</svg>
