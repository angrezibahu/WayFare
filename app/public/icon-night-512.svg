<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="76" fill="#1c2230"/>

  <!-- scattered background stars -->
  <g fill="#f5efe3" opacity="0.35">
    <circle cx="48" cy="60" r="1"/>
    <circle cx="120" cy="45" r="1.2"/>
    <circle cx="220" cy="40" r="0.8"/>
    <circle cx="340" cy="55" r="1"/>
    <circle cx="420" cy="38" r="1.3"/>
    <circle cx="478" cy="70" r="0.9"/>
    <circle cx="30" cy="250" r="0.8"/>
    <circle cx="495" cy="250" r="1"/>
    <circle cx="252" cy="246" r="0.7"/>
    <circle cx="60" cy="448" r="1"/>
    <circle cx="165" cy="462" r="1.1"/>
    <circle cx="296" cy="456" r="0.9"/>
    <circle cx="395" cy="462" r="1.2"/>
    <circle cx="462" cy="446" r="1"/>
  </g>

  <!-- constellation lines -->
  <g stroke="#f5efe3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.38">
    <!-- W -->
    <polyline points="75,100 108,220 130,148 152,220 185,100"/>
    <!-- A (from WAY) -->
    <polyline points="201,220 256,100 311,220"/>
    <line x1="228.5" y1="166" x2="283.5" y2="166"/>
    <!-- Y -->
    <polyline points="327,100 382,160 437,100"/>
    <line x1="382" y1="160" x2="382" y2="220"/>

    <!-- F -->
    <polyline points="62,400 62,280 147,280"/>
    <line x1="62" y1="340" x2="121.5" y2="340"/>
    <!-- A (from FARE) -->
    <polyline points="163,400 205.5,280 248,400"/>
    <line x1="184.25" y1="346" x2="226.75" y2="346"/>
    <!-- R -->
    <line x1="264" y1="280" x2="264" y2="400"/>
    <polyline points="264,280 336.25,280 336.25,340 264,340"/>
    <line x1="336.25" y1="340" x2="349" y2="400"/>
    <!-- E -->
    <polyline points="450,280 365,280 365,400 450,400"/>
    <line x1="365" y1="340" x2="424.5" y2="340"/>
  </g>

  <!-- stars at every letter vertex -->
  <g fill="#f5efe3">
    <!-- W -->
    <circle cx="75" cy="100" r="5"/>
    <circle cx="108" cy="220" r="4.5"/>
    <circle cx="130" cy="148" r="5.5"/>
    <circle cx="152" cy="220" r="4.5"/>
    <circle cx="185" cy="100" r="5"/>
    <!-- A (WAY) — the apex is a slightly brighter "named" star -->
    <circle cx="201" cy="220" r="4.5"/>
    <circle cx="256" cy="100" r="6"/>
    <circle cx="311" cy="220" r="4.5"/>
    <circle cx="228.5" cy="166" r="3.8"/>
    <circle cx="283.5" cy="166" r="3.8"/>
    <!-- Y -->
    <circle cx="327" cy="100" r="5"/>
    <circle cx="382" cy="160" r="5.2"/>
    <circle cx="437" cy="100" r="5"/>
    <circle cx="382" cy="220" r="4.5"/>
    <!-- F -->
    <circle cx="62" cy="280" r="5"/>
    <circle cx="62" cy="400" r="4.5"/>
    <circle cx="147" cy="280" r="5"/>
    <circle cx="62" cy="340" r="4"/>
    <circle cx="121.5" cy="340" r="4"/>
    <!-- A (FARE) — apex also brighter -->
    <circle cx="163" cy="400" r="4.5"/>
    <circle cx="205.5" cy="280" r="6"/>
    <circle cx="248" cy="400" r="4.5"/>
    <circle cx="184.25" cy="346" r="3.8"/>
    <circle cx="226.75" cy="346" r="3.8"/>
    <!-- R -->
    <circle cx="264" cy="280" r="5"/>
    <circle cx="264" cy="400" r="4.5"/>
    <circle cx="336.25" cy="280" r="5"/>
    <circle cx="336.25" cy="340" r="4.2"/>
    <circle cx="264" cy="340" r="4"/>
    <circle cx="349" cy="400" r="4.5"/>
    <!-- E -->
    <circle cx="450" cy="280" r="5"/>
    <circle cx="365" cy="280" r="5"/>
    <circle cx="365" cy="400" r="4.5"/>
    <circle cx="450" cy="400" r="4.5"/>
    <circle cx="365" cy="340" r="4"/>
    <circle cx="424.5" cy="340" r="4"/>
  </g>
</svg>
