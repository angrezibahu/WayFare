name: Deploy PWA to GitHub Pages

# Builds the /app/ PWA and publishes it via GitHub Pages.
# After this file lands on `main`, enable Pages once in repo settings:
#   Settings → Pages → Source: "GitHub Actions".
# The site will then be available at https://angrezibahu.github.io/wayfare/

on:
  push:
    branches:
      - main
      - claude/build-wayfare-foundation-exM56
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deploy. Don't cancel in-progress runs; let them finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Generate printables
        working-directory: .
        run: node scripts/build-printables.mjs

      - name: Bundle printables with PWA
        working-directory: .
        run: |
          mkdir -p app/dist/printables
          cp -r printables/. app/dist/printables/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
